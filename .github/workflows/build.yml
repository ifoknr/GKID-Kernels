name: GKID Builder
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      TODO:
        description: "Task to perform"
        default: "kernel"
        type: choice
        options:
          - "kernel"
          - "defconfig"

      KERNEL_VERSION:
        description: "GKI LTS kernel version"
        default: "6.1"
        type: choice
        options:
          - "6.1"
          - "5.10"
          - "5.15"
          - "6.6"
          - "6.12"
          - "All"

      GKI_BUILD_ID:
        description: "Google AOSP Build ID (اتركه فارغاً لجلب أحدث بناء رسمي تلقائياً)"
        required: false
        type: string
        default: ""

      ROOT_ENGINE:
        description: "Choose Root Manager & Stealth Engine"
        default: "KernelSU-Next-SUSFS"
        type: choice
        options:
          - "KernelSU-Next-SUSFS"
          - "ReSukiSU-SUSFS"
          - "Official-KSU-SUSFS"

      nomount_engine:
        description: "Choose NoMount / VFS Engine"
        default: "NoMount-Suite-Prism"
        type: choice
        options:
          - "NoMount-Suite-Prism"
          - "None"

      LTO:
        description: "Enable LTO optimization"
        default: "fullLTO"
        type: choice
        options:
          - "fullLTO"
          - "thinLTO"
          - "noneLTO"

      TEST:
        description: "Debug the pipeline"
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

      CLEAN_LTO_CACHE:
        description: "Clean ThinLTO cache to fix .config bug"
        type: boolean
        default: true

      NM:
        description: "Enable NoMount support"
        type: boolean
        default: true

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Matrix Settings
        id: set-matrix
        run: |
          export KERNEL_VERSION="${{ inputs.KERNEL_VERSION }}"
          export BUILD_VANILLA="false"
          export BUILD_KSU="false"
          export BUILD_KSU_SUSFS="true"
          python3 py/generate-matrix.py >> "$GITHUB_OUTPUT"

  ensure-cache-release:
    name: Ensure ccache release exists
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Create persistent cache release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view ci-ccache-store --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "ci-ccache-store already exists"
          else
            echo "Creating ci-ccache-store release"
            gh release create ci-ccache-store \
              --repo "${{ github.repository }}" \
              --title "CI ccache store (internal - do not delete)" \
              --notes "Persistent compiler cache used by the build workflow." \
              --prerelease \
              --latest=false
          fi

  build:
    needs: [prepare, ensure-cache-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdw-dev ccache gh bc bison flex libssl-dev libelf-dev dwarves cpio python3-lxml curl jq wget lz4 tar

      - name: Restore ccache from release
        if: github.event.inputs.TEST == 'no' && github.event.inputs.TODO != 'defconfig'
        id: restore-ccache
        uses: ./.github/actions/ccache-restore
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          variant: ${{ matrix.name }}

      - name: Run Build Script
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_REPO: https://github.com/ahmed-alnassif/GKI-Duchamp-6.1
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          KSU: ${{ matrix.KSU }}
          KSU_COMPAT: ${{ matrix.KSU_COMPAT }}
          KSU_SUSFS: ${{ matrix.KSU_SUSFS }}
          C_LTO: ${{ matrix.C_LTO }}
          No_DS: true
          DROIDSPACES: false
          NH: false
          NM: ${{ inputs.NM }}
          NOMOUNT_ENGINE: ${{ inputs.nomount_engine }}
          ROOT_ENGINE: ${{ inputs.ROOT_ENGINE }}
          TODO: ${{ inputs.TODO }}
          TEST: ${{ inputs.TEST }}
          LTO: ${{ inputs.LTO }}
          CLEAN_LTO_CACHE: ${{ inputs.CLEAN_LTO_CACHE }}
          BUILD_NAME: ${{ matrix.name }}
          RUN_NUM: -r${{ github.run_number }}
          LOCALVERSION: "-IFOKNR-Kernel"
          KBUILD_BUILD_USER: "IFOKNR"
          KBUILD_BUILD_HOST: "Galaxy-Tab"
        run: |
          export GIT_CLONE_PROTECTION_ACTIVE=false
          export LOCALVERSION="-IFOKNR-Kernel"
          export KBUILD_BUILD_USER="IFOKNR"
          export KBUILD_BUILD_HOST="Galaxy-Tab"
          chmod +x *.sh py/*.py
          ./build.sh

      - name: Fetch Stock GKI & Repack boot.img
        if: github.event.inputs.TODO != 'defconfig'
        run: |
          echo "⚙️ تجهيز أداة magiskboot للتجميع..."
          mkdir -p gki_work/stock
          cd gki_work
          wget -qO magiskboot.tar.xz https://github.com/Magisk-Modules-Alt-Repo/magiskboot_ndk_on_linux/releases/latest/download/magiskboot.tar.xz
          tar -xf magiskboot.tar.xz
          chmod +x magiskboot
          cd ..

          # تحديد فرع AOSP والـ Build ID الافتراضي بحسب إصدار النواة
          K_VER="${{ matrix.kernel_version }}"
          case "$K_VER" in
            "6.1")
              BRANCH="android14-6.1"
              DEFAULT_BID="16466991"
              ;;
            "6.6")
              BRANCH="android15-6.6"
              DEFAULT_BID="16467000"
              ;;
            "5.15")
              BRANCH="android13-5.15"
              DEFAULT_BID="14524900"
              ;;
            "5.10")
              BRANCH="android12-5.10"
              DEFAULT_BID="14120400"
              ;;
            *)
              BRANCH="android14-6.1"
              DEFAULT_BID="16466991"
              ;;
          esac

          BUILD_ID="${{ inputs.GKI_BUILD_ID }}"
          if [ -z "$BUILD_ID" ]; then
            BUILD_ID="$DEFAULT_BID"
          fi

          echo "🌐 جلب Stock GKI boot.img ($BRANCH) برقم البناء: $BUILD_ID"
          TARGET="kernel_aarch64"
          URL="https://ci.android.com/builds/submitted/$BUILD_ID/$TARGET/latest/raw/boot-lz4.img"
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o "gki_work/stock/boot.img" "$URL")

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "⚠️ تعذر تنزيل نسخة lz4، جاري تنزيل نسخة boot.img غير المضغوطة..."
            curl -fL -o "gki_work/stock/boot.img" "https://ci.android.com/builds/submitted/$BUILD_ID/$TARGET/latest/raw/boot.img" || true
          fi

          # البحث عن ملف النواة المبني (Image أو Image.lz4)
          KERNEL_BIN=$(find out/ arch/arm64/boot/ artifacts/ . -maxdepth 4 -name "Image" -type f 2>/dev/null | grep -v "/\.git/" | head -n 1)

          if [ -f "gki_work/stock/boot.img" ] && [ -n "$KERNEL_BIN" ]; then
            echo "💉 حقن ملف الكيرنل الجديد ($KERNEL_BIN) داخل boot.img..."
            cd gki_work/stock
            ../magiskboot unpack boot.img
            cp "../../$KERNEL_BIN" ./kernel
            ../magiskboot repack boot.img ../../boot-${{ matrix.name }}.img
            cd ../..

            mkdir -p artifacts
            cp "boot-${{ matrix.name }}.img" artifacts/
            echo "✅ تم إنتاج boot-${{ matrix.name }}.img بنجاح وجاهز للتفليش:"
            ls -lh "artifacts/boot-${{ matrix.name }}.img"
          else
            echo "⚠️ تعذر إتمام الـ Repack: تأكد من تنزيل الـ boot الأصلي ووجود ملف Image مبني."
          fi

      - name: ccache stats
        if: always()
        run: |
          ccache --show-stats

      - name: Save ccache to release
        if: always() && github.event.inputs.TEST == 'no' && github.event.inputs.TODO != 'defconfig'
        uses: ./.github/actions/ccache-save
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          variant: ${{ matrix.name }}

      - name: Save environment for release
        if: always()
        run: |
          cat > build-env-${{ matrix.name }}.txt << EOF
          RELEASE_REPO=${{ env.RELEASE_REPO }}
          KERNEL_NAME=${{ env.KERNEL_NAME }}
          RELEASE_NAME=${{ env.RELEASE_NAME }}
          RELEASE=${{ env.RELEASE }}
          LINUX_VERSION=${{ env.LINUX_VERSION }}
          COMPILER_STRING=${{ env.COMPILER_STRING }}
          SUSFS_VERSION=${{ env.SUSFS_VERSION }}
          BASE_NAME=${{ env.BASE_NAME }}
          KSU=${{ matrix.KSU }}
          KSU_SUSFS=${{ matrix.KSU_SUSFS }}
          KERNEL_VERSION=${{ env.KERNEL_VERSION }}
          ANDROID_RELEASE=${{ env.ANDROID_RELEASE }}
          KERNEL_SOURCE_REPO=${{ env.KERNEL_SOURCE_REPO }}
          KERNEL_SOURCE_BRANCH=${{ env.KERNEL_SOURCE_BRANCH }}
          EOF

          echo "BUILD_VARIANT=${{ matrix.name }}" >> build-env-${{ matrix.name }}.txt
          echo "Saved environment for ${{ matrix.name }}"

          if find . -name "*.rej" -type f | grep -q .; then
            mkdir -p rejected-patches-${{ matrix.name }}
            find . -name "*.rej" -type f -exec sh -c 'cp "$1" "rejected-patches-${{ matrix.name }}/$(echo "$1" | sed "s|^\./||; s|/|_|g")"' _ {} \;
            echo "Found $(find rejected-patches-${{ matrix.name }} -type f | wc -l) rejected patch files"
          else
            echo "No rejected patches found for ${{ matrix.name }}"
          fi

      - name: Upload environment file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-env-${{ matrix.name }}-${{ github.run_number }}
          path: |
            build-env-${{ matrix.name }}.txt
            rejected-patches-${{ matrix.name }}/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 1
          if-no-files-found: ignore

  upload-all:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-builds-${{ github.run_number }}
          retention-days: 7
          path: |
            downloaded-artifacts/*.txt
            downloaded-artifacts/*.zip
            downloaded-artifacts/*.img
          if-no-files-found: ignore

  release:
    needs: [build, upload-all]
    if: success() && github.event.inputs.TODO != 'defconfig'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum *.zip *.img > checksums.txt 2>/dev/null || true
          md5sum *.zip *.img > checksums-md5.txt 2>/dev/null || true

      - name: Load environment from builds and prepare release body
        env:
          TEST_INPUT: ${{ inputs.TEST }}
          DROIDSPACES_INPUT: false
          NH_INPUT: false
          NM_INPUT: ${{ inputs.NM }}
          LTO_INPUT: ${{ inputs.LTO }}
        run: python3 .github/scripts/prepare_release.py

      - name: Upload All Builds to release repo
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE }}
          prerelease: true
          files: |
            release-artifacts/*.zip
            release-artifacts/*.img
            release-artifacts/checksums.txt
            release-artifacts/checksums-md5.txt
          body_path: release_body.md
